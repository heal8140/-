<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>coming-soon予約管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2ea000;
  --red:#df3030;
  --bg:#efecdf;
  --panel:#f7f7f7;
  --line:#d5d5d5;
  --line-dark:#b7b7b7;
  --text:#333;
  --muted:#7a7a7a;
  --blue:#6fb9d9;
  --pill:#ffffff;
  --shadow:0 1px 1px rgba(0,0,0,.06), 0 1px 0 rgba(255,255,255,.55) inset;
  --card-shadow:0 1px 0 rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.08);
  --header-h:88px;
  --topbar-h:86px;
  --sidebar-w:260px;
  --time-w:130px;
  --slot-h:35px;
  --row-h:54px;
  --free-h:210px;
  --slot-min:76px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:#fff;
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit}
.top-green{height:4px;background:var(--green)}
.header{
  height:44px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  border-bottom:1px solid #dcdcdc;
  background:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
}
.logo{
  font-size:18px;
  font-weight:700;
  color:#cf2f2f;
  letter-spacing:.02em;
  margin-right:4px;
  position:relative;
  line-height:1;
}
.logo:before{
  content:"";
  position:absolute;
  top:-7px;left:50%;
  transform:translateX(-50%);
  width:28px;height:3px;
  border-radius:999px;
  background:#b02424;
}
.home{font-size:23px;color:#2c2c2c;line-height:1}
.menu{
  height:44px;
  display:flex;
  align-items:center;
  font-size:14px;
  color:#222;
  padding:0 8px;
  cursor:default;
  position:relative;
  white-space:nowrap;
}
.menu.active{
  background:#efefef;
  border-left:1px solid #e0e0e0;
  border-right:1px solid #e0e0e0;
}
.menu.active:before{
  content:"";
  position:absolute;
  top:0;left:50%;
  transform:translateX(-50%);
  width:36px;height:3px;
  border-radius:999px;
  background:#d63a3a;
}
.right-group{
  margin-left:auto;
  display:flex;
