    <script>
      function initialize() {

      }
      function NewWindow(url, name, width, height){
      	newWin = window.open(url, name, ("toolbar=no, location=no, directories=no, status=no, menubar=no, scrollbars=yes, resizeable=no, width=" + width + ", height=" + height));
      	newWin.focus();
      }

      function EditCustomer(val, reservationDate){
      	urlStr = "/ucs/manager/registerReservedCustomer.do?isReadMaster=true&customerId=" + val + "&latestReservationHistory=true&reservationDate=" + reservationDate;
      	NewWindow(urlStr, "CUSTOMER", 770, 730);
      }

      function openHelp(){
        if (false){
          urlStr = "https://secure01.red.shared-server.net/www.sosjapan.co.jp/backup/BackupHelp/Backuphelp.htm";
        } else {
          urlStr = "/support/gcsfaq/?p=178";
        }
        window.open(urlStr);//新規タブで開く
      }

      function openAppMailHelp(){
      	urlStr = "https://1cs.jp/support/gcsfaq/?p=14795";
      	NewWindow(urlStr, "HELP", 800, 600);
      }

      function DivTransfer(reserveNo, val){
      	switch(val) {
      	case 0:
      		window.location = "/ucs/reserveService.do";
      		break;
      	case 1:
      		urlStr = "/ucs/manager/reserveMatcher.do";
      		NewWindow(urlStr, "MATCHER", 600, 500);
      		break;
      	case 13:
      		reserveNo = reserveNo.split("-").join("");
      		urlStr = "/ucs/manager/reserveMatcher.do?_SEQUENCE=13&reserveId=" + reserveNo;
      		NewWindow(urlStr, "MATCHER", 600, 500);
      		break;
      	}
      }

      function Settings(val) {
      	DivTransfer(null, val);
      }

      function moveBook(targetDate) {
      	var uri = "/ucs/reserveService.do";
      	if(targetDate) {
      		uri += "?StartupDate=" + targetDate;
      	}
      	window.location = uri;
      }

      function forwardReservation(targetDate) {
      	moveBook(targetDate);
      }

      //休日情報取得
      function callFindHolidays(callbackFuncName) {
        ReservationTableAppService.findHolidaysV1(function (result) {
          if (result && result.holidays){
            for (var i in result.holidays){
              result.holidays[i].yyyymmdd = moment(result.holidays[i].date).format('YYYYMMDD');
            }
          }
          getBookElement()[callbackFuncName](JSON.stringify(result.holidays || null));
        });
      }

      //認証番号登録
      function callRegisterCustomerByAffiliateNumber(salonId, customerId, affilateNumber, callbackFuncName){
      	ReservationAppHandshakeService.registerCustomerByAffiliateNumber(salonId, customerId, affilateNumber, function(result){
      		var bookElement = getBookElement();
      		if (bookElement) bookElement[callbackFuncName](result);
      	});
      }

      //認証番号解除
      function callRemoveCustomer(salonId, customerId, appOwnerId, callbackFuncName){
      	ReservationAppHandshakeService.removeCustomer(salonId, customerId, appOwnerId, function(result){
      		var bookElement = getBookElement();
      		if (bookElement) bookElement[callbackFuncName](result);
      	});
      }

      //登録済みリスト取得
      function callFindAppOwnerByCustomer(salonId, customerId, callbackFuncName){
      	ReservationAppHandshakeService.findAppOwnerByCustomer(salonId, customerId, function(result){
      		var bookElement = getBookElement();
      		if (bookElement) bookElement[callbackFuncName](JSON.stringify(result));
      	});
      }

      //アプリ告知メール送信
      function callExecSendAppUrlViaMail(salonId, customerId, callbackFuncName){
      	ReservationAppHandshakeService.execSendAppUrlViaMail(salonId, customerId, function(result){
      		getBookElement()[callbackFuncName](result);
      	});
      }

      //重複顧客かも？
      function callFindIfUserIsPossiblyDuplicated(customerId, callbackFuncName){
        if (customerId <= 0) {
          return getBookElement()[callbackFuncName](false);
        }
        CustomerSearchService.findIfUserIsPossiblyDuplicated(customerId, function(result){
          getBookElement()[callbackFuncName](result);
        });
      }

      //例外エラー
      dwr.engine.setErrorHandler(function(message, ex) {
      	var bookElement = getBookElement();
      	if (bookElement) bookElement.resultExError(message, ex);
      });

      //予約管理画面　book.swfの貼り付けエレメントを取得
      function getBookElement(){
      	return document.book || window.book || getFlashElementById("book");
      }

      function getFlashElementById(id){
      	var element = document.getElementById(id);
      	if(!element) return null;

      	var nodes = element.getElementsByTagName("embed");
      	if(nodes.length){
      		return nodes[nodes.length-1];
      	}

      	var nodes = element.getElementsByTagName("object");
      	if(nodes.length){
      		return nodes[nodes.length-1];
      	}

      	return null;
      }
      function gotoSubMenu(action) {
    		location.href="/ucs" + action;
      }
      function gotoSubMenuWithNewWindow(action) {
          window.open("/ucs" + action, "_blank");
      }
    </script>
