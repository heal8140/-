<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>クリックゲーム</title>

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:sans-serif;
      color:white;
    }

    .game{
      text-align:center;
    }

    h1{
      font-size:48px;
      margin-bottom:20px;
    }

    button{
      padding:20px 40px;
      font-size:24px;
      border:none;
      border-radius:12px;
      cursor:pointer;
    }

    button:hover{
      opacity:0.8;
    }

  </style>
</head>

<body>

  <div class="game">

    <h1 id="score">0</h1>

    <button id="btn">
      クリック！
    </button>

  </div>

  <script>

    let score = 0;

    const scoreText = document.getElementById("score");
    const btn = document.getElementById("btn");

    btn.addEventListener("click", ()=>{

      score++;

      scoreText.textContent = score;

    });

  </script>

</body>
</html>
